  <div class="archive-toast is-hidden" id="toast" role="status"></div>

  <!-- 指令弹窗：AI 审查这类只出指令、不写数据的动作，点了先弹窗看清要做什么再复制 -->
  <dialog class="sd-dialog" id="sd-prompt-dialog">
    <div class="sd-dlg">
      <header class="sd-dlg-head">
        <h2 id="sd-dlg-title">AI 审查</h2>
        <button class="sd-dlg-x" type="button" data-sd-dlg="close" aria-label="关闭" title="关闭">×</button>
      </header>
      <div class="sd-dlg-body">
        <p class="sd-dlg-copy" id="sd-dlg-copy"></p>
        <div class="sd-dlg-result">
          <div class="sd-dlg-result-head"><b>指令</b><em>复制后粘到对话框执行</em></div>
          <pre class="sd-dlg-pre" id="sd-dlg-text"></pre>
        </div>
      </div>
      <footer class="sd-dlg-foot">
        <button class="sd-dlg-cancel" type="button" data-sd-dlg="close">取消</button>
        <button class="sd-dlg-ok" type="button" data-sd-dlg="copy">确认</button>
      </footer>
    </div>
  </dialog>

  <!-- 确认弹窗：「通过审查确认终稿」这类点了会直接写数据的动作，先确认再执行 -->
  <dialog class="sd-dialog is-confirm" id="sd-confirm-dialog">
    <div class="sd-dlg">
      <header class="sd-dlg-head">
        <h2 id="sd-cfm-title">通过审查确认终稿</h2>
        <button class="sd-dlg-x" type="button" data-sd-cfm="close" aria-label="关闭" title="关闭">×</button>
      </header>
      <div class="sd-dlg-body">
        <p class="sd-dlg-copy" id="sd-cfm-copy"></p>
      </div>
      <footer class="sd-dlg-foot">
        <button class="sd-dlg-cancel" type="button" data-sd-cfm="close">取消</button>
        <button class="sd-dlg-ok" type="button" data-sd-cfm="ok" id="sd-cfm-ok">确认</button>
      </footer>
    </div>
  </dialog>
